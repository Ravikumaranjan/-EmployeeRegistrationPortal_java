<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">
                <span class="brand-icon">💼</span> Employee Portal
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <!-- Left Column: Registration Form -->
            <div class="col-lg-4 mb-4">
                <div class="card shadow border-0 rounded-3 custom-card">
                    <div class="card-header bg-white border-0 pt-4 pb-0">
                        <h4 class="mb-0" id="formTitle">Register Employee</h4>
                    </div>
                    <div class="card-body">
                        <form id="employeeForm">
                            <!-- Hidden ID field for updates -->
                            <input type="hidden" id="employeeId">
                            
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="name" placeholder="Enter full name" required>
                                <div class="invalid-feedback">Please enter a valid name.</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="department" class="form-label">Department</label>
                                <select class="form-select" id="department" required>
                                    <option value="" selected disabled>Select Department</option>
                                    <option value="IT">IT</option>
                                    <option value="HR">HR</option>
                                    <option value="Finance">Finance</option>
                                    <option value="Marketing">Marketing</option>
                                    <option value="Operations">Operations</option>
                                    <option value="Sales">Sales</option>
                                </select>
                                <div class="invalid-feedback">Please select a department.</div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="salary" class="form-label">Salary</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="salary" placeholder="0.00" step="0.01" min="0" required>
                                    <div class="invalid-feedback" style="width: 100%;">Please enter a valid salary amount.</div>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary" id="saveBtn">Save Employee</button>
                                <button type="button" class="btn btn-outline-secondary d-none" id="cancelBtn">Cancel Update</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Right Column: Employee Table -->
            <div class="col-lg-8">
                <div class="card shadow border-0 rounded-3 custom-card">
                    <div class="card-header bg-white border-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">Employee Directory</h4>
                        <span class="badge bg-primary rounded-pill" id="totalEmployees">0</span>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col">ID</th>
                                        <th scope="col">Name</th>
                                        <th scope="col">Department</th>
                                        <th scope="col">Salary</th>
                                        <th scope="col" class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="employeeTableBody">
                                    <!-- Rows will be populated by JavaScript -->
                                    <tr>
                                        <td colspan="5" class="text-center text-muted py-4">Loading employees...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/app.js"></script>
</body>
</html>
